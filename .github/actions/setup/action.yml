name: Setup Python
description: >
  Single owner of the pinned setup-python step (Plan 134). Workflows use
  this composite after actions/checkout: a same-repo local action cannot
  run before checkout, so checkout stays the first step of each workflow.
inputs:
  python-version:
    description: >
      Interpreter for the steps that follow. Plan 156 runs the installer
      surface check on the 3.9 the installer supports; everything else
      stays on the router's 3.14.
    default: "3.14"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}
