name: Validate plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s plugins/scg-review/support/git-hooks/tests -v
  native-schedulers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start the disposable Linux user manager
        if: runner.os == 'Linux'
        run: |
          scheduler_uid="$(id -u)"
          sudo systemctl start "user@${scheduler_uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${scheduler_uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${scheduler_uid}/bus" >> "$GITHUB_ENV"
      - name: Migrate to one native schedule and update both plugins using a local CLI fixture
        run: python -m unittest discover -s tests -p 'test_scheduling*.py' -v
        env:
          SCG_TEST_NATIVE_SCHEDULER: '1'
