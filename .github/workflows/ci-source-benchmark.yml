# Complete source and layout comparison. Diagnostic checks cannot authorise a release.
name: Whole CI source and layout comparison

on:
  push:
    branches: ['cyril/ci-finish-ready-bench-*']

permissions:
  contents: read

jobs:
  before:
    name: Before
    uses: ./.github/workflows/windows-ci-benchmark.yml
    with:
      source_ref: b815fe5262168f536f06f627714112a5bfbe6ab0
      source_repository: ${{ vars.HISTORICAL_SOURCE_REPOSITORY }}
      arm: before
      layout: combined

  after:
    name: After
    uses: ./.github/workflows/windows-ci-benchmark.yml
    with:
      source_ref: ${{ github.sha }}
      arm: after
      layout: partitioned
