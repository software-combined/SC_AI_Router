name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-feed
  cancel-in-progress: false
  queue: max

env:
  AWS_REGION: ap-southeast-2
  # Stack name only: it carries no account id, so it may stay a literal here.
  FEED_STACK: scg-router-feed
  # Repository variables, not secrets and not literals (Plan 160): an account
  # id, a bucket name or a role ARN in the tree is an identifier disclosure and
  # a fork running the publisher must not inherit our target by default.
  FEED_BUCKET: ${{ vars.FEED_BUCKET }}
  FEED_ROLE: ${{ vars.FEED_ROLE }}
  # ARN of the Secrets Manager secret holding the feed signing seed.
  # Empty fails closed rather than shipping unsigned.
  FEED_SIGNING_SEED_ARN: ${{ vars.FEED_SIGNING_SEED_ARN }}

jobs:
  release:
    name: Build and publish
    # Check both identities: reruns use the original actor's privileges.
    # Main acceptance owns the long checks. Both channels publish only an
    # exact commit with a successful Check run, without repeating that suite.
    if: ${{ contains(fromJSON('["SC-Cyril", "BrentJMaxwell"]'), github.actor) && contains(fromJSON('["SC-Cyril", "BrentJMaxwell"]'), github.triggering_actor) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Require the feed variables
        # A fork or a misconfigured repository must fail here, before it tries
        # to assume a role it cannot assume (Plan 160).
        run: |
          for name in FEED_BUCKET FEED_ROLE FEED_SIGNING_SEED_ARN; do
            if [ -z "${!name}" ]; then
              echo "repository variable $name is empty; set it in repository settings (docs/operations.md)"; exit 1
            fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require accepted main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release commit must be merged into main before publication"; exit 1;
          }
          ACCEPTANCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | length')
          if [ "$ACCEPTANCE" -lt 1 ]; then
            echo "no successful Check workflow run found for $GITHUB_SHA on main"; exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Verify runtime pins
        run: python tools/verify_runtime_pins.py
      - name: Build bundle
        run: |
          python packaging/release.py --out dist --build "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
            --url-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          CHANNEL=$(python -c "import json;print(json.load(open('dist/latest.json'))['channel'])")
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
      - name: Configure feed publishing credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ env.FEED_ROLE }}
          role-session-name: router-feed-publish
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve the feed distribution
        run: |
          DIST_ID="$(aws cloudformation describe-stacks --stack-name "$FEED_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)"
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "no DistributionId output on $FEED_STACK"; exit 1
          fi
          echo "FEED_DISTRIBUTION_ID=$DIST_ID" >> "$GITHUB_ENV"
      - name: Publish to the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$GITHUB_REF_NAME" --jq .sha)
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "release tag changed; start a new release run"; exit 1
          fi
          SEED_FILE="$(mktemp)"
          trap 'rm -f "$SEED_FILE"' EXIT
          aws secretsmanager get-secret-value --secret-id "$FEED_SIGNING_SEED_ARN" \
            --query SecretString --output text > "$SEED_FILE"
          python tools/publish_feed.py --dist dist --channel "$CHANNEL" \
            --bucket "$FEED_BUCKET" --distribution-id "$FEED_DISTRIBUTION_ID" \
            --sign "$SEED_FILE"
          rm -f "$SEED_FILE"
          trap - EXIT
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" = stable ]; then
            cp dist/release-latest.json dist/latest.json
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/latest.json dist/feed-latest.json.sig --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --latest
          else
            cp dist/release-latest.json dist/latest-beta.json
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/latest-beta.json dist/feed-latest.json.sig --verify-tag --title "$GITHUB_REF_NAME" --prerelease --generate-notes
          fi
