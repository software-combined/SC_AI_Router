name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s tests -t .
      - run: python packaging/release.py --out dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta* ]]; then
            cp dist/latest.json dist/latest-beta.json
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/latest.json dist/latest-beta.json --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/latest.json --generate-notes
          fi
