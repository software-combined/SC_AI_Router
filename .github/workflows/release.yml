name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-feed
  cancel-in-progress: false
  queue: max

env:
  AWS_REGION: ap-southeast-2
  FEED_STACK: scg-router-feed
  FEED_BUCKET: router-feed-publication
  FEED_ROLE: arn:aws:iam::${AWS_ACCOUNT_ID}:role/scg-router-feed-publisher

jobs:
  release:
    name: Build and publish
    # Check both identities: reruns use the original actor's privileges.
    if: >-
      contains(fromJSON('["SC-Cyril", "BrentJMaxwell"]'), github.actor) &&
      contains(fromJSON('["SC-Cyril", "BrentJMaxwell"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: python -m unittest discover -s tests -t .
      - name: Verify runtime pins
        run: python tools/verify_runtime_pins.py
      - name: Build bundle
        run: |
          case "$GITHUB_REF_NAME" in
            v*-beta) CHANNEL=beta ;;
            v*) CHANNEL=stable ;;
            *) echo "release must run from a v* tag, got $GITHUB_REF_NAME"; exit 1 ;;
          esac
          TAG_VERSION="${GITHUB_REF_NAME#v}"; TAG_VERSION="${TAG_VERSION%-beta}"
          BASE_VERSION="$(cat packaging/VERSION)"
          if [ "$TAG_VERSION" != "$BASE_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME != packaging/VERSION $BASE_VERSION"; exit 1
          fi
          python packaging/release.py --out dist --build "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA" --channel "$CHANNEL" \
            --url-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
      - name: Configure feed publishing credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ env.FEED_ROLE }}
          role-session-name: router-feed-publish
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve the feed distribution
        run: |
          DIST_ID="$(aws cloudformation describe-stacks --stack-name "$FEED_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)"
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "no DistributionId output on $FEED_STACK"; exit 1
          fi
          echo "FEED_DISTRIBUTION_ID=$DIST_ID" >> "$GITHUB_ENV"
      - name: Publish to the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$GITHUB_REF_NAME" --jq .sha)
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "release tag changed; start a new release run"; exit 1
          fi
          python tools/publish_feed.py --dist dist --channel "$CHANNEL" \
            --bucket "$FEED_BUCKET" --distribution-id "$FEED_DISTRIBUTION_ID"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json;print(json.load(open('dist/latest.json'))['version'])")
          if [ "$CHANNEL" = stable ]; then
            cp dist/release-latest.json dist/latest.json
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/latest.json --verify-tag --title "v$VERSION" --generate-notes --latest
          else
            cp dist/release-latest.json dist/latest-beta.json
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/latest-beta.json --verify-tag --title "v$VERSION-beta" --prerelease --generate-notes
          fi
