name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-feed
  cancel-in-progress: false
  queue: max

env:
  AWS_REGION: ap-southeast-2
  FEED_STACK: scg-router-feed
  FEED_BUCKET: router-feed-publication
  FEED_ROLE: arn:aws:iam::${AWS_ACCOUNT_ID}:role/scg-router-feed-publisher
  # ARN of the Secrets Manager secret holding the feed signing seed (Plan
  # 145 Step 1 ceremony). Empty until the owner creates the secret; the
  # publish step fails closed without it rather than shipping unsigned.
  FEED_SIGNING_SEED_ARN: ''

jobs:
  installer-macos:
    name: Installer (macOS)
    # A release ships the installer half to macOS and Windows hosts, so the
    # native checks run before anything is published (Plan 156).
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Native installer tests
        shell: bash
        run: python -m unittest $(python tools/ci_scope.py --installer-tests)

  installer-windows:
    name: Installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Native installer tests
        shell: bash
        run: python -m unittest $(python tools/ci_scope.py --installer-tests)

  installer-python39:
    name: Installer (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.9"
      - name: Installer surface imports on 3.9
        run: python tools/check_installer_python39.py

  release:
    name: Build and publish
    needs: [installer-macos, installer-windows, installer-python39]
    # Check both identities: reruns use the original actor's privileges.
    # !cancelled() keeps this job visible when an installer check failed, so
    # the required step below fails it; a cancelled run stops the job instead
    # of letting a publish finish.
    if: ${{ !cancelled() && contains(fromJSON('["SC-Cyril", "BrentJMaxwell"]'), github.actor) && contains(fromJSON('["SC-Cyril", "BrentJMaxwell"]'), github.triggering_actor) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Required installer checks
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "an installer check did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: python -m unittest discover -s tests -t .
      - name: Verify runtime pins
        run: python tools/verify_runtime_pins.py
      - name: Build bundle
        run: |
          python packaging/release.py --out dist --build "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
            --url-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          CHANNEL=$(python -c "import json;print(json.load(open('dist/latest.json'))['channel'])")
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
      - name: Configure feed publishing credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ env.FEED_ROLE }}
          role-session-name: router-feed-publish
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve the feed distribution
        run: |
          DIST_ID="$(aws cloudformation describe-stacks --stack-name "$FEED_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)"
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "no DistributionId output on $FEED_STACK"; exit 1
          fi
          echo "FEED_DISTRIBUTION_ID=$DIST_ID" >> "$GITHUB_ENV"
      - name: Publish to the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$GITHUB_REF_NAME" --jq .sha)
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "release tag changed; start a new release run"; exit 1
          fi
          SEED_FILE="$(mktemp)"
          trap 'rm -f "$SEED_FILE"' EXIT
          aws secretsmanager get-secret-value --secret-id "$FEED_SIGNING_SEED_ARN" \
            --query SecretString --output text > "$SEED_FILE"
          python tools/publish_feed.py --dist dist --channel "$CHANNEL" \
            --bucket "$FEED_BUCKET" --distribution-id "$FEED_DISTRIBUTION_ID" \
            --sign "$SEED_FILE"
          rm -f "$SEED_FILE"
          trap - EXIT
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json;print(json.load(open('dist/latest.json'))['version'])")
          if [ "$CHANNEL" = stable ]; then
            cp dist/release-latest.json dist/latest.json
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/latest.json dist/feed-latest.json.sig --verify-tag --title "v$VERSION" --generate-notes --latest
          else
            cp dist/release-latest.json dist/latest-beta.json
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/latest-beta.json dist/feed-latest.json.sig --verify-tag --title "v$VERSION-beta" --prerelease --generate-notes
          fi
