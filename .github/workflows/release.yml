name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s tests -t .
      - name: Verify runtime pins
        run: python tools/verify_runtime_pins.py
      - name: Build bundle
        run: |
          case "$GITHUB_REF_NAME" in
            v*-beta) CHANNEL=beta ;;
            v*) CHANNEL=stable ;;
            *) echo "release must run from a v* tag, got $GITHUB_REF_NAME"; exit 1 ;;
          esac
          TAG_VERSION="${GITHUB_REF_NAME#v}"; TAG_VERSION="${TAG_VERSION%-beta}"
          BASE_VERSION="$(cat packaging/VERSION)"
          if [ "$TAG_VERSION" != "$BASE_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME != packaging/VERSION $BASE_VERSION"; exit 1
          fi
          python packaging/release.py --out dist --build "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA" --channel "$CHANNEL"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json;print(json.load(open('dist/latest.json'))['version'])")
          if [ "$CHANNEL" = stable ]; then
            gh release create "v$VERSION" dist/*.tar.gz dist/latest.json --generate-notes --latest
          else
            cp dist/latest.json dist/latest-beta.json
            gh release create "v$VERSION-beta" dist/*.tar.gz dist/latest-beta.json --prerelease --generate-notes
          fi
