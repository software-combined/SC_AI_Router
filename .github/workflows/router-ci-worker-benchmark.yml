      - name: Shell syntax
        shell: bash
        # The bootstrap and installer shells ship to every host; a syntax
        # error should fail here, not on a recipient's machine.
        run: |
          for f in packaging/*.sh; do
            sh -n "$f" || { echo "$f failed sh -n"; exit 1; }
          done
      - name: PowerShell parse
        shell: pwsh
        # Real parser validation, not a lint pass: a .ps1 syntax error is
        # otherwise only discovered on a Windows host.
        run: |
          foreach ($f in Get-ChildItem packaging/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$($f.Name)::$($_.Message)" }
              exit 1
            }
          }
      - run: python -m compileall -q ai_router tools tests packaging
      - name: Lint (F401/F811)
        # python -m ruff: the script location differs by platform, the module
        # import does not. Version + wheel hash pinned (repo convention for
        # CI inputs); both Ubuntu and macOS wheels are listed so the same pin
        # works for manual runs.
        run: |
          python -m pip install --user --require-hashes --only-binary :all: \
            -r .github/requirements-lint.txt
          # Explicit --select, not just pyproject: CI pins the enforced rule
          # set so loosening the local config cannot widen this gate.
          python -m ruff check --select F401,F811 ai_router packaging tools tests
      - run: python tools/check_source_limits.py
      - name: CloudFormation lint
        # The feed stack is the fleet's code-execution path; lint it on the
        # same runner that would deploy it. Pinned: lint results change with
        # the rule set, and an unpinned rule would fail unrelated PRs.
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.56.3
          cfn-lint infra/*.yaml
      - name: Model registry check (offline)
        # Live-model check needs network; offline mode pins the registry
        # shape deterministically on every runner.
        run: python -m ai_router.models check --offline
      - name: Catalogue merge check
        run: |
          python -m ai_router.catalogue --merge ./ci-catalogue.json
          python -m ai_router.catalogue --check ./ci-catalogue.json
      - name: Policy scans
        # Single owner (Plan 134): tools/check_policy_scans.py implements the
        # request-cap and secrets greps, so the same scan runs locally and in
        # CI. Behaviour and failure messages match the inline steps it
        # replaces.
        run: python tools/check_policy_scans.py
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/router-ci-reports/*.json
          if-no-files-found: error
          retention-days: 30

  desktop-menus:
    name: Desktop menu (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: darwin/arm64, runner: macos-15}
          - {target: darwin/x86_64, runner: macos-15-intel}
          - {target: windows/x86_64, runner: windows-2025}
          - {target: linux/x86_64, runner: ubuntu-24.04}
          - {target: linux/arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b67c9cb4a87ae20acf42c69fe5ae916d61ec01dc
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.14.9"
      - name: Pin macOS certificate bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-deps --force-reinstall certifi==2026.10.23
          python - <<'PY'
          import certifi, os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as destination:
              destination.write('SSL_CERT_FILE=' + certifi.where() + '\n')
          PY
      - name: Frozen source and environment
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, platform, ssl, subprocess, sys
          from pathlib import Path
          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert checkout == 'b67c9cb4a87ae20acf42c69fe5ae916d61ec01dc', checkout
          assert tree == '5f111c8ed8ccad2f851e61d0de663d26f140995f', tree
          paths = ssl.get_default_verify_paths()
          certificates = ssl.create_default_context().get_ca_certs(binary_form=True)
          tls = {'openssl': ssl.OPENSSL_VERSION, 'default_paths': paths._asdict(),
                 'ca_bundle_sha256': hashlib.sha256(Path(paths.cafile).read_bytes()).hexdigest() if paths.cafile else None,
                 'ca_certificates_sha256': hashlib.sha256(''.join(sorted(hashlib.sha256(value).hexdigest() for value in certificates)).encode()).hexdigest(),
                 'ca_certificate_count': len(certificates)}
          if sys.platform == 'darwin':
              import certifi
              assert importlib.metadata.version('certifi') == '2026.10.23'
              assert paths.cafile and Path(paths.cafile).resolve() == Path(certifi.where()).resolve()
              assert tls['ca_bundle_sha256'] == hashlib.sha256(Path(certifi.where()).read_bytes()).hexdigest()
          report = {'checkout': checkout, 'tree': tree, 'python': sys.version,
                    'platform': platform.platform(), 'image_os': os.environ.get('ImageOS'),
                    'image_version': os.environ.get('ImageVersion'),
                    'runner_os': os.environ['RUNNER_OS'], 'runner_arch': os.environ['RUNNER_ARCH'],
                    'logical_cpus': os.cpu_count(), 'tls': tls,
                    'harness': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'],
                    'run_id': os.environ['GITHUB_RUN_ID'], 'job': os.environ['GITHUB_JOB'],
                    'packages': sorted((dist.metadata['Name'], dist.version)
                                       for dist in importlib.metadata.distributions())}
          destination = Path(os.environ['RUNNER_TEMP']) / 'router-ci-reports'
          destination.mkdir(exist_ok=True)
          (destination / 'environment.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Pinned Linux menu toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Compile native helper
        run: python tools/check_native_menu_build.py --target ${{ matrix.target }}
      - name: Native compiler identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          if sys.platform == 'darwin':
              print(subprocess.check_output(['xcrun', 'swiftc', '--version'], text=True))
          elif sys.platform == 'win32':
              compiler = Path(os.environ['WINDIR']) / 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
              version = subprocess.check_output(['pwsh', '-NoProfile', '-NonInteractive', '-Command',
                  "(Get-Item ($env:WINDIR + '/Microsoft.NET/Framework64/v4.0.30319/csc.exe')).VersionInfo.FileVersion"], text=True)
              print(json.dumps({'compiler': 'Framework64/csc.exe', 'version': version.strip(),
                                'sha256': hashlib.sha256(compiler.read_bytes()).hexdigest()}))
          else:
              print(subprocess.check_output(['rustc', '+1.90.0', '--version', '--verbose'], text=True))
              print(subprocess.check_output(['cargo', '+1.90.0', '--version'], text=True))
          PY
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/router-ci-reports/*.json
          if-no-files-found: error
          retention-days: 30

