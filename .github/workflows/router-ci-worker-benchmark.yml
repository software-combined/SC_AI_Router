          SCG_RUN_INSTALLER_TESTS: '1'
          BENCHMARK_WORKERS: ${{ startsWith(github.ref_name, 'cyril/router-ci-workers-candidate-') && '2' || '1' }}
        run: python tools/ci_unittest.py --workers "$BENCHMARK_WORKERS" --report "${{ runner.temp }}/router-ci-reports/unittest-1.json" -- discover -s tests -t .
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/router-ci-reports/*.json
          if-no-files-found: error
          retention-days: 30

  test:
    name: Benchmark verification
    needs: [changes, installer-macos, installer-windows, installer-python39, desktop-menus, plugin-schedulers, hook-adapter, unit-suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Required jobs
        env:
          BENCHMARK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['BENCHMARK_RESULTS'])
          expected = {'changes', 'installer-macos', 'installer-windows',
                      'installer-python39', 'desktop-menus', 'plugin-schedulers',
                      'hook-adapter', 'unit-suite'}
          assert set(results) == expected, results
          assert all(result['result'] == 'success' for result in results.values()), results
