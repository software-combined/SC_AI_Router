                 'ca_certificates_sha256': hashlib.sha256(''.join(sorted(hashlib.sha256(value).hexdigest() for value in certificates)).encode()).hexdigest(),
                 'ca_certificate_count': len(certificates)}
          if sys.platform == 'darwin':
              import certifi
              assert importlib.metadata.version('certifi') == '2026.10.23'
              assert paths.cafile and Path(paths.cafile).resolve() == Path(certifi.where()).resolve()
              assert tls['ca_bundle_sha256'] == hashlib.sha256(Path(certifi.where()).read_bytes()).hexdigest()
          report = {'checkout': checkout, 'tree': tree, 'python': sys.version,
                    'platform': platform.platform(), 'image_os': os.environ.get('ImageOS'),
                    'image_version': os.environ.get('ImageVersion'),
                    'runner_os': os.environ['RUNNER_OS'], 'runner_arch': os.environ['RUNNER_ARCH'],
                    'logical_cpus': os.cpu_count(), 'tls': tls,
                    'harness': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'],
                    'run_id': os.environ['GITHUB_RUN_ID'], 'job': os.environ['GITHUB_JOB'],
                    'packages': sorted((dist.metadata['Name'], dist.version)
                                       for dist in importlib.metadata.distributions())}
          destination = Path(os.environ['RUNNER_TEMP']) / 'router-ci-reports'
          destination.mkdir(exist_ok=True)
          (destination / 'environment.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Native installer tests
        shell: bash
        run: python tools/ci_unittest.py --report "${{ runner.temp }}/router-ci-reports/unittest-1.json" -- $(python tools/ci_scope.py --installer-tests)
      - name: Native suite inventory
        shell: bash
        run: python tools/ci_scope.py --installer-tests
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/router-ci-reports/*.json
          if-no-files-found: error
          retention-days: 30

