                    'harness': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'],
                    'run_id': os.environ['GITHUB_RUN_ID'], 'job': os.environ['GITHUB_JOB'],
                    'packages': sorted((dist.metadata['Name'], dist.version)
                                       for dist in importlib.metadata.distributions())}
          destination = Path(os.environ['RUNNER_TEMP']) / 'router-ci-reports'
          destination.mkdir(exist_ok=True)
          (destination / 'environment.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Start the disposable Linux user manager
        if: runner.os == 'Linux'
        run: |
          scheduler_uid="$(id -u)"
          sudo systemctl start "user@${scheduler_uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${scheduler_uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${scheduler_uid}/bus" >> "$GITHUB_ENV"
      - name: Native scheduler migration
        run: python tools/ci_unittest.py --report "${{ runner.temp }}/router-ci-reports/unittest-1.json" -- tests.test_scheduling_native -v
        env:
          SCG_TEST_NATIVE_SCHEDULER: '1'

      - name: Native Router update recovery
        if: runner.os == 'Linux'
        run: python tools/ci_unittest.py --report "${{ runner.temp }}/router-ci-reports/unittest-2.json" -- tests.test_router_scheduler_native -v
        env:
          SCG_TEST_NATIVE_ROUTER_SCHEDULER: '1'
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/router-ci-reports/*.json
          if-no-files-found: error
          retention-days: 30

  hook-adapter:
    name: Hook adapter portability
    # The SCG hook adapter ships to every host and claims native Windows
    # support for the receipt gate, the shims and the scanner. No other job
    # runs its tests, so this is their only executor: without the matrix, the
    # Windows claim would be asserted rather than exercised. Main acceptance
    # only, like the scheduler job above.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
