    # Native plugin schedules and Router recovery use real service managers
    # on disposable runners. Run for main acceptance; development stays lightweight.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b67c9cb4a87ae20acf42c69fe5ae916d61ec01dc
          persist-credentials: false
