# Frozen diagnostic copy of Check: synthetic runner fixtures only; no release authority.
name: Paired whole CI partition experiment

on:
  push:
    branches: ['cyril/windows-ci-bench-*']

permissions:
  contents: read

concurrency:
  group: windows-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Change scope
    # Native installer jobs are part of main acceptance. Develop runs skip
    # them (Plan 156, narrowed 2026-09-15), and so does a text edit.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      installer: ${{ steps.scope.outputs.installer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The diff needs the base branch, so fetch full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Installer scope
        id: scope
        run: echo "installer=true" >> "$GITHUB_OUTPUT"

  installer-macos:
    name: Installer (macOS)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py
      - name: Native installer tests
        shell: bash
        run: python -m unittest $(python tools/ci_scope.py --installer-tests)

  installer-windows:
    name: Installer (Windows)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py
      - name: Native installer tests
        shell: bash
        run: python -m unittest $(python tools/ci_scope.py --installer-tests)
      - name: Native packaging contracts (PowerShell)
        shell: pwsh
        run: python -m unittest tests.test_native_stage tests.test_native_packages tests.test_native_setup tests.test_native_readiness tests.test_native_menu_build
      - name: Failed standard-user launch cleans up its account
        shell: pwsh
        run: python -m unittest tests.test_windows_standard_ci.StandardUserLaunchFailureTests
      - name: Native ACL contract (PowerShell)
        shell: pwsh
        run: python -m unittest tests.test_windows_acl_native

  installer-python39:
    name: Installer (Python 3.9)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    # Pinned: actions/python-versions publishes no 3.9 build for Ubuntu 26.04,
    # which ubuntu-latest now resolves to; 24.04 still has 3.9.25.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.9.25"
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py
      - name: Installer surface imports on 3.9
        run: python tools/check_installer_python39.py

  windows-standard:
    name: Windows standard user (${{ matrix.suite }})
    needs: changes
    if: needs.changes.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        suite: [core]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py
      - name: Core and native contracts without administrator rights
        shell: pwsh
        run: ./tools/run_windows_standard.ps1 -Python (Get-Command python).Source -Suite ${{ matrix.suite }} -EvidencePath "$env:RUNNER_TEMP/windows-results.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-${{ matrix.suite }}
          path: ${{ runner.temp }}/windows-results.json
          if-no-files-found: error
          retention-days: 7

  windows-control-native:
    name: Windows standard user (native)
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - uses: ./.github/actions/diagnostic-powershell
        id: pinned-shell
      - name: Resolved runner environment
        shell: pwsh
        env:
          CI_PWSH: ${{ steps.pinned-shell.outputs.executable }}
        run: python tools/ci_environment.py --pwsh-executable "$env:CI_PWSH"
      - name: Native contracts without administrator rights
        shell: pwsh
        env:
          CI_PWSH: ${{ steps.pinned-shell.outputs.executable }}
        run: |
          & $env:CI_PWSH -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tools/run_windows_standard.ps1 -Python (Get-Command python).Source -Suite native -EvidencePath "$env:RUNNER_TEMP/windows-results.json"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native
          path: ${{ runner.temp }}/windows-results.json
          if-no-files-found: error
          retention-days: 7

  windows-native:
    name: Windows standard user (${{ matrix.suite }})
    needs: changes
    if: needs.changes.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        suite: [native-runtime, native-shortcuts]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - uses: ./.github/actions/diagnostic-powershell
        id: pinned-shell
      - name: Resolved runner environment
        shell: pwsh
        env:
          CI_PWSH: ${{ steps.pinned-shell.outputs.executable }}
        run: python tools/ci_environment.py --pwsh-executable "$env:CI_PWSH"
      - name: Native contracts without administrator rights
        shell: pwsh
        env:
          CI_PWSH: ${{ steps.pinned-shell.outputs.executable }}
        run: |
          & $env:CI_PWSH -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tools/run_windows_standard.ps1 -Python (Get-Command python).Source -Suite ${{ matrix.suite }} -EvidencePath "$env:RUNNER_TEMP/windows-results.json"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-${{ matrix.suite }}
          path: ${{ runner.temp }}/windows-results.json
          if-no-files-found: error
          retention-days: 7

  windows-native-aggregate:
    name: Candidate native aggregate
    needs: windows-native
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both native workers
        env:
          RESULT: ${{ needs.windows-native.result }}
        run: test "$RESULT" = success

  unit-suite:
    name: Offline unit suite
    # Independent of native acceptance. Starting both together avoids paying
    # for their durations in series; Test still requires every result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py
      - name: Unit suite (offline)
        env:
          SCG_RUN_INSTALLER_TESTS: '1'
          VERIFICATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python tools/plugin_verification.py --full --run --workers 2 --report "$RUNNER_TEMP/unit-results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-results
          path: ${{ runner.temp }}/unit-results.json
          if-no-files-found: error
          retention-days: 7

  test:
    # A diagnostic branch must never emit the release gate's Test name.
    name: Diagnostic acceptance (control)
    # Both paths reuse identical common results but retain separate static tails.
    needs: [changes, installer-macos, installer-windows, installer-python39, desktop-menus, plugin-schedulers, hook-adapter, unit-suite, windows-standard, windows-control-native]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      ARM: control
    steps: &acceptance-steps
      - name: Required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          required = {'changes', 'installer-macos', 'installer-windows', 'installer-python39',
                      'desktop-menus', 'plugin-schedulers', 'hook-adapter', 'unit-suite',
                      'windows-standard'}
          required |= {'control': {'windows-control-native'},
                       'candidate': {'windows-native', 'windows-native-aggregate'}}[os.environ['ARM']]
          if set(needs) != required:
              raise SystemExit('required diagnostic job evidence is missing or unexpected')
          wrong = {name: row['result'] for name, row in needs.items()
                   if row['result'] != 'success'}
          if wrong:
              raise SystemExit('required diagnostic jobs did not succeed: ' + repr(wrong))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
          # This job is the one place that downloads wheels (ruff, cfn-lint).
          # Key it on the hashed lint requirements and on this workflow, so
          # changing cfn-lint's inline pin below also re-warms the cache.
          cache: pip
          cache-dependency-path: |
            .github/requirements-lint.txt
            .github/workflows/check.yml
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py
      - name: Shell syntax
        shell: bash
        # The bootstrap and installer shells ship to every host; a syntax
        # error should fail here, not on a recipient's machine.
        run: |
          for f in packaging/*.sh; do
            sh -n "$f" || { echo "$f failed sh -n"; exit 1; }
          done
      - name: PowerShell parse
        shell: pwsh
        # Real parser validation, not a lint pass: a .ps1 syntax error is
        # otherwise only discovered on a Windows host.
        run: |
          foreach ($f in Get-Item packaging/*.ps1, tools/run_windows_standard.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$($f.Name)::$($_.Message)" }
              exit 1
            }
          }
      - run: python -m compileall -q ai_router tools tests packaging
      - name: Lint (F401/F811)
        # python -m ruff: the script location differs by platform, the module
        # import does not. Version + wheel hash pinned (repo convention for
        # CI inputs); both Ubuntu and macOS wheels are listed so the same pin
        # works for manual runs.
        run: |
          python -m pip install --user --require-hashes --only-binary :all: \
            -r .github/requirements-lint.txt
          # Explicit --select, not just pyproject: CI pins the enforced rule
          # set so loosening the local config cannot widen this gate.
          python -m ruff check --select F401,F811 ai_router packaging tools tests
      - run: python tools/check_source_limits.py
      - name: CloudFormation lint
        # The feed stack is the fleet's code-execution path; lint it on the
        # same runner that would deploy it. Pinned: lint results change with
        # the rule set, and an unpinned rule would fail unrelated PRs.
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.56.3
          cfn-lint infra/*.yaml
      - name: Model registry check (offline)
        # Live-model check needs network; offline mode pins the registry
        # shape deterministically on every runner.
        run: python -m ai_router.models check --offline
      - name: Catalogue merge check
        run: |
          python -m ai_router.catalogue --merge ./ci-catalogue.json
          python -m ai_router.catalogue --check ./ci-catalogue.json
      - name: Policy scans
        # Single owner (Plan 134): tools/check_policy_scans.py implements the
        # request-cap and secrets greps, so the same scan runs locally and in
        # CI. Behaviour and failure messages match the inline steps it
        # replaces.
        run: python tools/check_policy_scans.py
      - name: Final static environment
        run: python tools/ci_environment.py

  candidate-test:
    name: Diagnostic acceptance (candidate)
    needs: [changes, installer-macos, installer-windows, installer-python39, desktop-menus, plugin-schedulers, hook-adapter, unit-suite, windows-standard, windows-native, windows-native-aggregate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      ARM: candidate
    steps: *acceptance-steps

  desktop-menus:
    name: Desktop menu (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: darwin/arm64, runner: macos-15}
          - {target: darwin/x86_64, runner: macos-15-intel}
          - {target: windows/x86_64, runner: windows-2025}
          - {target: linux/x86_64, runner: ubuntu-24.04}
          - {target: linux/arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - name: Pinned Linux menu toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py --desktop-target ${{ matrix.target }}
      - name: Compile native helper
        run: python tools/check_native_menu_build.py --target ${{ matrix.target }}

  plugin-schedulers:
    name: Plugin schedulers
    # Native plugin schedules and Router recovery use real service managers
    # on disposable runners. Run for main acceptance; development stays lightweight.
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py
      - name: Start the disposable Linux user manager
        if: runner.os == 'Linux'
        run: |
          scheduler_uid="$(id -u)"
          sudo systemctl start "user@${scheduler_uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${scheduler_uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${scheduler_uid}/bus" >> "$GITHUB_ENV"
      - name: Native scheduler migration
        run: python -m unittest tests.test_scheduling_native -v
        env:
          SCG_TEST_NATIVE_SCHEDULER: '1'

      - name: Native Router update recovery
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_router_scheduler_native -v
        env:
          SCG_TEST_NATIVE_ROUTER_SCHEDULER: '1'

  hook-adapter:
    name: Hook adapter portability
    # The SCG hook adapter ships to every host and claims native Windows
    # support for the receipt gate, the shims and the scanner. No other job
    # runs its tests, so this is their only executor: without the matrix, the
    # Windows claim would be asserted rather than exercised. Main acceptance
    # only, like the scheduler job above.
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14.9'
      - name: Resolved runner environment
        shell: bash
        run: python tools/ci_environment.py
      - name: Hook adapter tests
        # The receipt gate, the interpreter selection and the shims run on
        # both platforms. Tests needing a POSIX scanner stub stay
        # POSIX-only; the portability module covers the scanner here.
        run: python -m unittest discover -s plugins/development/scg-review/support/git-hooks/tests -v
