AWSTemplateFormatVersion: '2010-09-09'
Description: Private deployment artifacts and an asymmetric signer for Router downloads.
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  Signer:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Signs short staff-only Router download grants; private material never leaves KMS.
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountPolicyDelegation
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
  SignerAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/scg-router-downloads
      TargetKeyId: !Ref Signer
Outputs:
  CodeBucket:
    Value: !Ref Artifacts
  SigningKeyArn:
    Value: !GetAtt Signer.Arn
