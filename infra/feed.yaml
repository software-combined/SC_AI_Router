AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Router update feed: private versioned bucket served publicly through
  CloudFront, DNS alias, and the tag-only GitHub Actions publisher role.
  Deploy in ap-southeast-2 after infra/feed-cert.yaml reports
  CREATE_COMPLETE.

Parameters:
  CertificateArn:
    Type: String
    Description: ACM certificate ARN from the scg-router-feed-cert stack (us-east-1).
  DomainName:
    Type: String
    Default: dist.softwarecombined.com
    Description: Feed hostname; must match the certificate.
  HostedZoneId:
    Type: String
    Default: Z0272966357LH6IEJY0NV
    Description: Public hosted zone for softwarecombined.com.
  BucketName:
    Type: String
    Description: >-
      Bucket holding feeds and immutable bundles. Retained on delete. No
      default (Plan 160): an account-bearing bucket name in the template is an
      identifier disclosure, so the deploy passes it.
  Repository:
    Type: String
    Default: software-combined/SC_Unlimited_ai
    Description: GitHub repository whose tag builds may assume the publisher role.
  ImmutableSubjectPrefix:
    Type: String
    Default: software-combined@200868195/SC_Unlimited_ai@1360169840
    Description: >-
      Repository IDs GitHub emits in an immutable OIDC subject (owner@id/repo@id),
      kept beside the classic form so either claim can assume the role.
  SigningSeedArn:
    Type: String
    Description: >-
      ARN of the Secrets Manager secret holding the feed signing seed
      (Plan 145), passed at deploy time. No default (Plan 160), because the
      ARN carries the account id.
    AllowedPattern: '^arn:aws[A-Za-z-]*:secretsmanager:[a-z0-9-]+:\d{12}:secret:.+$'
Resources:
  FeedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FeedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FeedBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlyThroughThisDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FeedBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  FeedOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: scg-router-feed-oac
        Description: Signed reads of the private router feed bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Software Combined router update feed
        Aliases:
          - !Ref DomainName
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        Origins:
          - Id: feed-bucket
            DomainName: !GetAtt FeedBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FeedOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: feed-bucket
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true

  FeedDns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  PublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: scg-router-feed-publisher
      Description: GitHub Actions OIDC publisher for the router feed (tag builds only)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${Repository}:ref:refs/tags/v*
                  - !Sub repo:${ImmutableSubjectPrefix}:ref:refs/tags/v*
      Policies:
        - PolicyName: publish-router-feed
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${FeedBucket.Arn}/*
              # Absent-object HeadObject returns 403 without ListBucket, and
              # the publisher's immutability check keys on the 404.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FeedBucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SigningSeedArn
Outputs:
  DistributionId:
    Description: Invalidation target; the release workflow reads this output.
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront domain behind the alias.
    Value: !GetAtt Distribution.DomainName
  BucketName:
    Description: Feed and bundle bucket.
    Value: !Ref FeedBucket
  PublisherRoleArn:
    Description: Role the release workflow assumes.
    Value: !GetAtt PublisherRole.Arn
  FeedUrl:
    Description: Stable feed document; beta lives at /beta/latest.json beside it.
    Value: !Sub https://${DomainName}/stable/latest.json
