AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Router update feed: private versioned bucket served publicly through
  CloudFront, DNS alias, and the tag-only GitHub Actions publisher role.
  Deploy in ap-southeast-2 after infra/feed-cert.yaml reports
  CREATE_COMPLETE.

Parameters:
  CertificateArn:
    Type: String
    Description: ACM certificate ARN from the scg-router-feed-cert stack (us-east-1).
  DomainName:
    Type: String
    Default: dist.softwarecombined.com
    Description: Feed hostname; must match the certificate.
  HostedZoneId:
    Type: String
    Default: Z0272966357LH6IEJY0NV
    Description: Public hosted zone for softwarecombined.com.
  BucketName:
    Type: String
    Description: >-
      Bucket holding feeds and immutable bundles. Retained on delete. No
      default (Plan 160): an account-bearing bucket name in the template is an
      identifier disclosure, so the deploy passes it.
  Repository:
    Type: String
    Default: software-combined/SC_Unlimited_ai
    Description: GitHub repository whose tag builds may assume the publisher role.
  ImmutableSubjectPrefix:
    Type: String
    Default: software-combined@200868195/SC_Unlimited_ai@1360169840
    Description: >-
      Repository IDs GitHub emits in an immutable OIDC subject (owner@id/repo@id),
      kept beside the classic form so either claim can assume the role.
  NotificationEmail:
    Type: String
    Description: >-
      Address that receives one email per bundle write, including a second
      write of an existing key. No default (Plan 167): the deploy passes it.
  SigningSeedArn:
    Type: String
    Description: >-
      ARN of the Secrets Manager secret holding the feed signing seed
      (Plan 145), passed at deploy time. No default (Plan 160), because the
      ARN carries the account id.
    AllowedPattern: '^arn:aws[A-Za-z-]*:secretsmanager:[a-z0-9-]+:\d{12}:secret:.+$'
Resources:
  FeedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        # EventBridge carries the event; the rule below filters and targets it.
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  FeedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FeedBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlyThroughThisDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FeedBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  FeedOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: scg-router-feed-oac
        Description: Signed reads of the private router feed bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Software Combined router update feed
        Aliases:
          - !Ref DomainName
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        Origins:
          - Id: feed-bucket
            DomainName: !GetAtt FeedBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FeedOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: feed-bucket
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true

  FeedDns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  PublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: scg-router-feed-publisher
      Description: GitHub Actions OIDC publisher for the router feed (tag builds only)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${Repository}:ref:refs/tags/v*
                  - !Sub repo:${ImmutableSubjectPrefix}:ref:refs/tags/v*
      Policies:
        - PolicyName: publish-router-feed
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${FeedBucket.Arn}/*
              # Writes are scoped to what the release publisher actually
              # writes: bundles and the two channel documents. The
              # first-install keys (runtimes*, bootstrap/*) stay out: that
              # tool uploads with the operator's own credentials, and the
              # tag-scoped release role has no reason to write the bootstrap
              # every recipient downloads and executes (Plan 167).
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub ${FeedBucket.Arn}/bundles/*
                  - !Sub ${FeedBucket.Arn}/stable/latest.json
                  - !Sub ${FeedBucket.Arn}/stable/latest.json.sig
                  - !Sub ${FeedBucket.Arn}/stable/models.json
                  - !Sub ${FeedBucket.Arn}/beta/latest.json
                  - !Sub ${FeedBucket.Arn}/beta/latest.json.sig
                  - !Sub ${FeedBucket.Arn}/beta/models.json
              # Belt and braces: a later widening of the Allow above must not
              # reach the bucket's own configuration or delete an object.
              - Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:PutBucketPolicy
                  - s3:PutBucketAcl
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketVersioning
                  - s3:PutObjectAcl
                  # The publish email depends on the bucket's notification
                  # configuration, so a later widening must not be able to
                  # drop it or re-encrypt the bucket either.
                  - s3:PutBucketNotification
                  - s3:PutEncryptionConfiguration
                Resource:
                  - !GetAtt FeedBucket.Arn
                  - !Sub ${FeedBucket.Arn}/*
              # Absent-object HeadObject returns 403 without ListBucket, and
              # the publisher's immutability check keys on the 404.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FeedBucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SigningSeedArn
  # One email per bundle write. A second email for a key that already existed
  # is the signal this plan exists to give: the supported publisher refuses
  # the write, so a second write came from something that skipped it (167).
  FeedPublishTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: SCG router feed bundle published
  FeedPublishSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FeedPublishTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail
  FeedPublishRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref FeedBucket]
          object:
            key:
              - prefix: bundles/
      Targets:
        - Id: feed-publish-email
          Arn: !GetAtt FeedAlertFunction.Arn
  # The mail is written here rather than by an EventBridge InputTemplate
  # (Plan 167): a template substitutes raw, so an object key carrying a double
  # quote would break the JSON and silence the very alarm that write should
  # raise. Code can quote the key properly, and it sets the mail subject too.
  FeedAlertFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Formats one feed-publish event into the short alert email.
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt FeedAlertRole.Arn
      Environment:
        Variables:
          TOPIC_ARN: !Ref FeedPublishTopic
      Code:
        ZipFile: |
          """One S3 Object Created event -> the feed alert email (Plan 167)."""
          import os

          import boto3

          TOPIC_ARN = os.environ['TOPIC_ARN']
          TAIL = ('One email per bundle write is expected. A second email for a '
                  'bundle that already existed means something wrote to the feed '
                  'without going through the publisher.')


          def display(key):
              """One printable ASCII line: a subject rejects anything else."""
              line = ''.join(ch if 32 <= ord(ch) < 127 else ' ' for ch in str(key))
              return ' '.join(line.split())


          def handler(event, context):
              detail = event.get('detail') or {}
              obj = detail.get('object') or {}
              bucket = (detail.get('bucket') or {}).get('name', 'the feed bucket')
              key = display(obj.get('key', 'unknown object'))
              subject = 'SCG router feed: ' + key
              if len(subject) > 96:
                  subject = subject[:93] + '...'
              message = '\n'.join([
                  'A bundle was written to ' + bucket + '.',
                  '',
                  'Object:  ' + key,
                  'Size:    ' + str(obj.get('size', 'unknown')) + ' bytes',
                  'Version: ' + str(obj.get('version-id', 'unknown')),
                  'Time:    ' + str(event.get('time', 'unknown')),
                  'By:      ' + str(detail.get('reason', 'a write'))
                  + ' from account ' + str(detail.get('requester', 'unknown')),
                  '',
                  TAIL,
              ])
              boto3.client('sns').publish(TopicArn=TOPIC_ARN, Subject=subject,
                                          Message=message)
  # The function publishes to the topic; the rule invokes the function. Both
  # grants are pinned, and the old events.amazonaws.com topic permission goes
  # with the SNS target it existed for.
  FeedAlertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: publish-feed-alert
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FeedPublishTopic
  FeedAlertPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FeedAlertFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FeedPublishRule.Arn
Outputs:
  DistributionId:
    Description: Invalidation target; the release workflow reads this output.
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront domain behind the alias.
    Value: !GetAtt Distribution.DomainName
  BucketName:
    Description: Feed and bundle bucket.
    Value: !Ref FeedBucket
  PublisherRoleArn:
    Description: Role the release workflow assumes.
    Value: !GetAtt PublisherRole.Arn
  FeedUrl:
    Description: Stable feed document; beta lives at /beta/latest.json beside it.
    Value: !Sub https://${DomainName}/stable/latest.json
