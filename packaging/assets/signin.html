<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SCG Router</title>
<link rel="icon" href="data:image/png;base64,__LOGO__">
<style nonce="__NONCE__">
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(data:font/woff2;base64,__INTER__) format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url(data:font/woff2;base64,__DISPLAY__) format('woff2')}
:root{color-scheme:light;--canvas:hsl(240 7% 97%);--ink:hsl(240 4% 5%);--muted:hsl(240 3% 40%);--line:hsl(240 7% 89%)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--canvas);color:var(--ink);font:16px/1.6 Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100%,432px);padding:44px 32px 48px;text-align:center;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgb(12 12 13 / .05),0 10px 24px -12px rgb(12 12 13 / .15)}
img{display:block;width:96px;height:96px;margin:0 auto 24px}
h1{margin:0;font:400 clamp(26px,5vw,32px)/1.2 'Space Grotesk',Arial,sans-serif;letter-spacing:-.035em;text-wrap:balance}
p{margin:14px 0 0;color:var(--muted)}
@media(max-width:380px){body{padding:16px}main{padding:32px 20px 36px}}
</style>
<script nonce="__NONCE__">history.replaceState(null,"","/complete");</script>
</head>
<body>
<main aria-labelledby="confirmation">
<img src="data:image/png;base64,__LOGO__" alt="Software Combined" width="96" height="96">
<h1 id="confirmation">You're signed in</h1>
<p>You can close this tab.</p>
</main>
</body>
</html>
