[package]
name = "scg-router-menu"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
ksni = { version = "=0.3.6", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
