[project]
name = "ai-router"
version = "1.3.21"
requires-python = ">=3.14"
dependencies = []
description = "Local model router for Codex and Claude Code: subscription models and OpenRouter models side by side from one loopback endpoint."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Cyril Allart" },
]

[project.urls]
Homepage = "https://www.softwarecombined.com"
Repository = "https://github.com/software-combined/SC_AI_Router"
Changelog = "https://github.com/software-combined/SC_AI_Router/blob/main/CHANGELOG.md"
Issues = "https://github.com/software-combined/SC_AI_Router/issues"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["F401", "F811"]
