[project]
name = "ai-router"
version = "1.3.34"
requires-python = ">=3.14"
dependencies = []
description = "Local model router for Codex and Claude Code: subscription models and OpenRouter models side by side from one loopback endpoint."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Cyril Allart" },
]

[project.urls]
Homepage = "https://www.softwarecombined.com"
Repository = "https://github.com/software-combined/SC_AI"
Changelog = "https://github.com/software-combined/SC_AI/blob/main/router/CHANGELOG.md"
Issues = "https://github.com/software-combined/SC_AI/issues"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["F401", "F811"]
